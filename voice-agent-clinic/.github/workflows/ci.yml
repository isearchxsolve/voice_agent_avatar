name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r agent/requirements.txt -r webhook-server/requirements.txt pytest pytest-asyncio
      - run: python -m py_compile agent/main.py websocket_bridge.py webhook-server/main.py
      - run: python -m pytest -q
      - run: python -m pytest -m smoke -q
  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-widget/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
